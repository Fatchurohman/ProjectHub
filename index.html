<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Project Hub</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --tag-bg: #0369a1;
      --tag-text: #e0f2fe;
      --badge-3d-bg: linear-gradient(145deg, #1e293b, #0f172a);
      --badge-3d-shadow: 3px 3px 6px #080c16, -2px -2px 5px rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2.5rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    /* GitHub Profile Header Card */
    .profile-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.75rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .profile-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      object-fit: cover;
      flex-shrink: 0;
      background-color: #0f172a;
    }

    .profile-info {
      flex: 1;
    }

    .profile-name-row {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 0.35rem;
    }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .profile-username {
      font-size: 0.95rem;
      color: var(--accent);
      text-decoration: none;
    }

    .profile-username:hover {
      text-decoration: underline;
    }

    .profile-bio {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }

    .profile-meta-list {
      display: flex;
      gap: 1.25rem;
      flex-wrap: wrap;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .profile-meta-item strong {
      color: var(--text-main);
    }

    /* Controls Panel */
    .controls-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 0.75rem 1rem;
      background: #0b1120;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.75rem 1.5rem;
      background-color: var(--accent);
      color: #0b1120;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: var(--text-main);
    }

    button:active {
      transform: scale(0.98);
    }

    .filter-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    /* Projects Grid */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      width: 100%;
    }

    /* Card Item */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    /* Badge Nomor Urut 3D */
    .badge-3d {
      position: absolute;
      top: 14px;
      right: 14px;
      min-width: 38px;
      height: 38px;
      padding: 0 8px;
      background: var(--badge-3d-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9px;
      box-shadow: var(--badge-3d-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      user-select: none;
    }

    .card-header {
      margin-bottom: 0.75rem;
      padding-right: 48px; /* Ruang kosong agar tidak tertimpa badge nomor */
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      word-break: break-word;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .tag {
      background-color: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
    }

    .card-actions {
      display: flex;
      gap: 0.75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
    }

    .btn-link {
      flex: 1;
      text-align: center;
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-demo {
      background-color: var(--accent);
      color: #0b1120;
    }

    .btn-repo {
      background-color: #334155;
      color: var(--text-main);
    }

    .btn-link:hover {
      opacity: 0.9;
    }

    .status-msg {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 1.1rem;
      grid-column: 1 / -1;
    }

    .status-msg.error {
      color: #f87171;
    }

    @media (max-width: 640px) {
      .profile-card {
        flex-direction: column;
        text-align: center;
      }
      .profile-name-row {
        justify-content: center;
      }
      .profile-meta-list {
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="profile-container"></div>

    <div class="controls-card">
      <form id="user-form" class="form-group">
        <input type="text" id="username-input" placeholder="Masukkan GitHub Username (contoh: octocat)" required />
        <button type="submit">Ambil Proyek</button>
      </form>
      <div class="filter-options">
        <input type="text" id="search-input" placeholder="Cari nama aplikasi atau bahasa..." />
        <label class="checkbox-label">
          <input type="checkbox" id="pages-only-toggle" checked />
          Hanya yang ada Live Demo (Pages)
        </label>
      </div>
    </div>

    <main id="project-container" class="project-grid">
      <div class="status-msg">Masukkan username GitHub di atas untuk menampilkan profil dan proyek.</div>
    </main>
  </div>

  <script>
    const userForm = document.getElementById('user-form');
    const usernameInput = document.getElementById('username-input');
    const searchInput = document.getElementById('search-input');
    const pagesOnlyToggle = document.getElementById('pages-only-toggle');
    const profileContainer = document.getElementById('profile-container');
    const projectContainer = document.getElementById('project-container');

    let allRepos = [];
    let currentUsername = '';

    const escapeHTML = (str) => {
      if (!str || typeof str !== 'string') return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    };

    const renderProfile = (profile) => {
      if (!profile || typeof profile !== 'object') {
        profileContainer.innerHTML = '';
        return;
      }

      const avatar = escapeHTML(profile.avatar_url || '');
      const name = escapeHTML(profile.name || profile.login || 'GitHub User');
      const login = escapeHTML(profile.login || '');
      const bio = escapeHTML(profile.bio || 'Tidak ada deskripsi bio yang dicantumkan.');
      const reposCount = Number(profile.public_repos) || 0;
      const followers = Number(profile.followers) || 0;
      const following = Number(profile.following) || 0;

      profileContainer.innerHTML = `
        <header class="profile-card">
          <img src="${avatar}" alt="${name}" class="profile-avatar" />
          <div class="profile-info">
            <div class="profile-name-row">
              <h1 class="profile-name">${name}</h1>
              <a href="https://github.com/${login}" target="_blank" rel="noopener noreferrer" class="profile-username">@${login}</a>
            </div>
            <p class="profile-bio">${bio}</p>
            <div class="profile-meta-list">
              <span class="profile-meta-item"><strong>${reposCount}</strong> Repositori Publik</span>
              <span class="profile-meta-item"><strong>${followers}</strong> Followers</span>
              <span class="profile-meta-item"><strong>${following}</strong> Following</span>
            </div>
          </div>
        </header>
      `;
    };

    const renderRepos = () => {
      if (!Array.isArray(allRepos) || allRepos.length === 0) {
        projectContainer.innerHTML = '<div class="status-msg">Tidak ada repositori ditemukan.</div>';
        return;
      }

      const query = (searchInput.value || '').trim().toLowerCase();
      const pagesOnly = pagesOnlyToggle.checked;

      const filtered = allRepos.filter((repo) => {
        if (!repo || typeof repo !== 'object') return false;

        const hasPages = Boolean(repo.has_pages);
        if (pagesOnly && !hasPages) return false;

        const name = (repo.name || '').toLowerCase();
        const desc = (repo.description || '').toLowerCase();
        const lang = (repo.language || '').toLowerCase();

        return name.includes(query) || desc.includes(query) || lang.includes(query);
      });

      if (filtered.length === 0) {
        projectContainer.innerHTML = '<div class="status-msg">Tidak ada proyek yang sesuai dengan filter pencarian.</div>';
        return;
      }

      // Nomor urut 3D otomatis disesuaikan secara berurutan berdasarkan hasil filter aktif
      const cardsHtml = filtered.map((repo, index) => {
        const orderNumber = String(index + 1).padStart(2, '0');
        const title = escapeHTML(repo.name || 'Untitled');
        const description = escapeHTML(repo.description || 'Tidak ada deskripsi yang disediakan.');
        const language = repo.language ? `<span class="tag">${escapeHTML(repo.language)}</span>` : '';
        const repoUrl = escapeHTML(repo.html_url || '#');

        let demoUrl = '';
        if (repo.has_pages) {
          demoUrl = `https://${currentUsername.toLowerCase()}.github.io/${repo.name}/`;
        } else if (repo.homepage && typeof repo.homepage === 'string' && repo.homepage.startsWith('http')) {
          demoUrl = repo.homepage;
        }

        const demoButton = demoUrl
          ? `<a href="${escapeHTML(demoUrl)}" target="_blank" rel="noopener noreferrer" class="btn-link btn-demo">Buka Demo</a>`
          : '';

        return `
          <article class="card">
            <div class="badge-3d" title="Nomor Urut #${orderNumber}">#${orderNumber}</div>
            <div class="card-header">
              <h2 class="card-title">${title}</h2>
            </div>
            <p class="card-desc">${description}</p>
            <div class="card-meta">
              ${language}
              <span class="tag">⭐ ${Number(repo.stargazers_count) || 0}</span>
            </div>
            <div class="card-actions">
              ${demoButton}
              <a href="${repoUrl}" target="_blank" rel="noopener noreferrer" class="btn-link btn-repo">Source Code</a>
            </div>
          </article>
        `;
      }).join('');

      projectContainer.innerHTML = cardsHtml;
    };

    const fetchData = async (username) => {
      if (!username || typeof username !== 'string') return;

      currentUsername = username.trim();
      localStorage.setItem('saved_github_user', currentUsername);
      projectContainer.innerHTML = '<div class="status-msg">Memuat profil dan proyek dari GitHub...</div>';

      try {
        const encodedUser = encodeURIComponent(currentUsername);
        const [profileRes, reposRes] = await Promise.all([
          fetch(`https://api.github.com/users/${encodedUser}`),
          fetch(`https://api.github.com/users/${encodedUser}/repos?per_page=100&sort=updated`)
        ]);

        if (!profileRes.ok || !reposRes.ok) {
          if (profileRes.status === 404 || reposRes.status === 404) {
            throw new Error(`Username GitHub "${currentUsername}" tidak ditemukan.`);
          }
          if (profileRes.status === 403 || reposRes.status === 403) {
            throw new Error('Batas akses GitHub API (rate limit) habis. Silakan coba lagi nanti.');
          }
          throw new Error('Gagal memuat data dari GitHub API.');
        }

        const profileData = await profileRes.json();
        const reposData = await reposRes.json();

        if (!Array.isArray(reposData)) {
          throw new Error('Format repositori tidak valid.');
        }

        renderProfile(profileData);
        allRepos = reposData;
        renderRepos();
      } catch (err) {
        profileContainer.innerHTML = '';
        projectContainer.innerHTML = `<div class="status-msg error">${escapeHTML(err.message || 'Terjadi kesalahan sistem.')}</div>`;
      }
    };

    userForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = usernameInput.value.trim();
      if (user) {
        fetchData(user);
      }
    });

    searchInput.addEventListener('input', renderRepos);
    pagesOnlyToggle.addEventListener('change', renderRepos);

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('saved_github_user');
      if (savedUser) {
        usernameInput.value = savedUser;
        fetchData(savedUser);
      }
    });
  </script>
</body>
</html>
