<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Project Hub</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --tag-bg: #0369a1;
      --tag-text: #e0f2fe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .controls-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    button {
      padding: 0.75rem 1.5rem;
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
      color: var(--text-main);
    }

    .filter-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      width: 100%;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card-header {
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      word-break: break-word;
    }

    .card-desc {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      flex-grow: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .tag {
      background-color: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
    }

    .card-actions {
      display: flex;
      gap: 0.75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--card-border);
    }

    .btn-link {
      flex: 1;
      text-align: center;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn-demo {
      background-color: var(--accent);
      color: #0f172a;
    }

    .btn-repo {
      background-color: #334155;
      color: var(--text-main);
    }

    .btn-link:hover {
      opacity: 0.9;
    }

    .status-msg {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 1.1rem;
      grid-column: 1 / -1;
    }

    .status-msg.error {
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Personal Project Showcase</h1>
      <p>Koleksi web app & kodingan yang di-deploy otomatis via GitHub Pages</p>
    </header>

    <div class="controls-card">
      <form id="user-form" class="form-group">
        <input type="text" id="username-input" placeholder="Masukkan GitHub Username (contoh: octocat)" required />
        <button type="submit">Ambil Proyek</button>
      </form>
      <div class="filter-options">
        <input type="text" id="search-input" placeholder="Cari aplikasi..." />
        <label class="checkbox-label">
          <input type="checkbox" id="pages-only-toggle" checked />
          Tampilkan hanya yang ada Live Demo (Pages)
        </label>
      </div>
    </div>

    <main id="project-container" class="project-grid">
      <div class="status-msg">Masukkan username GitHub di atas untuk menampilkan proyek.</div>
    </main>
  </div>

  <script>
    const userForm = document.getElementById('user-form');
    const usernameInput = document.getElementById('username-input');
    const searchInput = document.getElementById('search-input');
    const pagesOnlyToggle = document.getElementById('pages-only-toggle');
    const projectContainer = document.getElementById('project-container');

    let allRepos = [];
    let currentUsername = '';

    const escapeHTML = (str) => {
      if (!str || typeof str !== 'string') return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    };

    const renderRepos = () => {
      if (!Array.isArray(allRepos) || allRepos.length === 0) {
        projectContainer.innerHTML = '<div class="status-msg">Tidak ada repositori ditemukan.</div>';
        return;
      }

      const query = (searchInput.value || '').trim().toLowerCase();
      const pagesOnly = pagesOnlyToggle.checked;

      const filtered = allRepos.filter((repo) => {
        if (!repo || typeof repo !== 'object') return false;

        const hasPages = Boolean(repo.has_pages);
        if (pagesOnly && !hasPages) return false;

        const name = (repo.name || '').toLowerCase();
        const desc = (repo.description || '').toLowerCase();
        const lang = (repo.language || '').toLowerCase();

        return name.includes(query) || desc.includes(query) || lang.includes(query);
      });

      if (filtered.length === 0) {
        projectContainer.innerHTML = '<div class="status-msg">Tidak ada proyek yang sesuai dengan kriteria filter.</div>';
        return;
      }

      const cardsHtml = filtered.map((repo) => {
        const title = escapeHTML(repo.name || 'Untitled');
        const description = escapeHTML(repo.description || 'Tidak ada deskripsi yang disediakan.');
        const language = repo.language ? `<span class="tag">${escapeHTML(repo.language)}</span>` : '';
        const repoUrl = escapeHTML(repo.html_url || '#');

        let demoUrl = '';
        if (repo.has_pages) {
          demoUrl = `https://${currentUsername.toLowerCase()}.github.io/${repo.name}/`;
        } else if (repo.homepage && typeof repo.homepage === 'string' && repo.homepage.startsWith('http')) {
          demoUrl = repo.homepage;
        }

        const demoButton = demoUrl
          ? `<a href="${escapeHTML(demoUrl)}" target="_blank" rel="noopener noreferrer" class="btn-link btn-demo">Buka Demo</a>`
          : '';

        return `
          <article class="card">
            <div class="card-header">
              <h2 class="card-title">${title}</h2>
            </div>
            <p class="card-desc">${description}</p>
            <div class="card-meta">
              ${language}
              <span class="tag">⭐ ${Number(repo.stargazers_count) || 0}</span>
            </div>
            <div class="card-actions">
              ${demoButton}
              <a href="${repoUrl}" target="_blank" rel="noopener noreferrer" class="btn-link btn-repo">Source Code</a>
            </div>
          </article>
        `;
      }).join('');

      projectContainer.innerHTML = cardsHtml;
    };

    const fetchRepos = async (username) => {
      if (!username || typeof username !== 'string') return;

      currentUsername = username.trim();
      localStorage.setItem('saved_github_user', currentUsername);
      projectContainer.innerHTML = '<div class="status-msg">Mengambil data proyek dari GitHub API...</div>';

      try {
        const response = await fetch(`https://api.github.com/users/${encodeURIComponent(currentUsername)}/repos?per_page=100&sort=updated`);

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error(`Username GitHub "${currentUsername}" tidak ditemukan.`);
          }
          if (response.status === 403) {
            throw new Error('Batas request GitHub API (rate limit) tercapai. Silakan coba lagi beberapa saat lagi.');
          }
          throw new Error(`Gagal mengambil data (HTTP ${response.status}).`);
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
          throw new Error('Format data dari GitHub API tidak valid.');
        }

        allRepos = data;
        renderRepos();
      } catch (err) {
        projectContainer.innerHTML = `<div class="status-msg error">${escapeHTML(err.message || 'Terjadi kesalahan sistem.')}</div>`;
      }
    };

    userForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = usernameInput.value.trim();
      if (user) {
        fetchRepos(user);
      }
    });

    searchInput.addEventListener('input', renderRepos);
    pagesOnlyToggle.addEventListener('change', renderRepos);

    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('saved_github_user');
      if (savedUser) {
        usernameInput.value = savedUser;
        fetchRepos(savedUser);
      }
    });
  </script>
</body>
</html>
